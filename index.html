<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Letter from Spring · 雨季</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4c5 6 8 9.5 8 14a8 8 0 1 1-16 0c0-4.5 3-8 8-14z' fill='%238fa07a'/%3E%3C/svg%3E">
<style>
/* ============ Letter from Spring — 清新简约文艺 ============ */
:root{
  /* primitive */
  --p-paper:#f6f6f1;      /* 纸白 */
  --p-paper-2:#efeee4;
  --p-card:#ffffff;
  --p-sage:#8fa07a;       /* 鼠尾草绿 */
  --p-sage-deep:#5f7050;
  --p-sage-soft:#dde3d2;
  --p-sage-mist:#eef1e7;
  --p-ink:#2e2e28;
  --p-ink-2:#71715f;
  --p-ink-3:#9a9a88;
  --p-line:#e3e3d5;
  --p-danger:#a4574a;
  /* semantic */
  --bg:var(--p-paper);
  --surface:var(--p-card);
  --surface-2:var(--p-paper-2);
  --text:var(--p-ink);
  --text-2:var(--p-ink-2);
  --text-3:var(--p-ink-3);
  --accent:var(--p-sage);
  --accent-deep:var(--p-sage-deep);
  --accent-soft:var(--p-sage-soft);
  --accent-mist:var(--p-sage-mist);
  --line:var(--p-line);
  --radius:14px;
  --radius-s:9px;
  --shadow:0 1px 2px rgba(46,46,40,.05),0 6px 18px rgba(46,46,40,.05);
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.7 var(--sans);
  color:var(--text);
  background:#e9e9e0;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ 应用外壳：手机上全屏铺开，桌面上居中成信笺 ============ */
#app{
  position:relative;
  height:100dvh;
  max-width:520px;
  margin:0 auto;
  background:var(--bg);
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 0 1px var(--line);
}
@media (min-width:560px){
  body{padding:24px 0}
  #app{height:calc(100dvh - 48px);border-radius:22px;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(46,46,40,.12)}
}

/* ============ 顶部标题信笺头 ============ */
.masthead{
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 10px;
  text-align:center;
  border-bottom:1px solid var(--line);
  background:
    radial-gradient(120% 90% at 50% -30%, var(--accent-mist) 0%, transparent 60%),
    var(--bg);
  position:relative;flex:none;
}
.masthead .season{
  font-family:var(--serif);
  font-size:19px;letter-spacing:.12em;color:var(--text);
  display:inline-flex;align-items:center;gap:10px;
}
.masthead .season::before,.masthead .season::after{
  content:"";width:3px;height:16px;background:var(--accent);opacity:.55;border-radius:2px;
}
.masthead .season::after{opacity:.28}
.masthead .subtitle{
  margin-top:2px;font-size:11px;letter-spacing:.35em;color:var(--text-3);text-indent:.35em;
}
.rain-deco{position:absolute;top:8px;right:16px;width:64px;height:44px;opacity:.7;pointer-events:none}

/* ============ 对话伙伴栏 ============ */
.peerbar{
  flex:none;display:flex;align-items:center;gap:11px;
  padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);
}
.peer-ava{
  width:44px;height:44px;border-radius:50%;overflow:hidden;flex:none;
  border:1px solid var(--line);background:var(--surface-2);position:relative;
}
.peer-ava img{width:100%;height:100%;object-fit:cover}
.peer-ava.patted{animation:patshake .5s ease}
@keyframes patshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.06)}75%{transform:rotate(8deg) scale(1.06)}}
.peer-info{flex:1;min-width:0}
.peer-name{font-family:var(--serif);font-size:16px;display:flex;align-items:center;gap:7px}
.peer-name .tag{
  font-family:var(--sans);font-size:10px;color:var(--accent-deep);
  border:1px solid var(--accent-soft);background:var(--accent-mist);
  padding:1px 7px;border-radius:99px;letter-spacing:.05em;font-weight:400;
}
.peer-status{
  font-size:12px;color:var(--text-2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.peer-status .dot{color:var(--accent);margin:0 4px}
.icon-btn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
  color:var(--accent-deep);border:1px solid var(--line);background:var(--surface);
  transition:transform .15s ease,background .15s ease;
}
.icon-btn:active{transform:scale(.92);background:var(--accent-mist)}
.icon-btn svg{width:19px;height:19px}

/* ============ 消息流 ============ */
#stream{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px 14px 12px;scroll-behavior:smooth;
}
.day-divider{
  display:flex;align-items:center;gap:10px;margin:16px 0 14px;
  color:var(--text-3);font-size:11px;letter-spacing:.25em;
}
.day-divider::before,.day-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.sys-msg{
  text-align:center;margin:12px auto;max-width:86%;
  font-size:12px;color:var(--text-2);
}
.sys-msg .pill{
  display:inline-block;padding:4px 13px;border:1px solid var(--line);
  border-radius:99px;background:var(--surface);box-shadow:var(--shadow);
}
.sys-msg .pill .t{color:var(--text-3);margin-left:6px;font-size:11px}
.row{display:flex;gap:9px;margin:12px 0;align-items:flex-end}
.row.me{flex-direction:row-reverse}
.row .ava{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;border:1px solid var(--line);background:var(--surface-2)}
.row .ava img{width:100%;height:100%;object-fit:cover}
.bubble-wrap{max-width:76%;display:flex;flex-direction:column;gap:4px}
.row.me .bubble-wrap{align-items:flex-end}
.bubble{
  padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.65;
  word-break:break-word;white-space:pre-wrap;position:relative;
  animation:pop .28s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
.row.nova .bubble{
  background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;
  box-shadow:var(--shadow);color:var(--text);
}
.row.me .bubble{
  background:var(--accent);color:#fdfdf9;border-bottom-right-radius:5px;
  border:1px solid var(--accent-deep);
}
.meta{font-size:11px;color:var(--text-3);padding:0 4px}
.row.nova .meta{align-self:flex-start}
.sticker-msg{
  width:118px;height:118px;object-fit:contain;flex:none;
  filter:drop-shadow(0 4px 8px rgba(46,46,40,.12));
  animation:pop .28s cubic-bezier(.2,.9,.3,1.2);
}
.typing{display:inline-flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.35;animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}
/* 竖排点缀（仿参考图日文竖排） */
.v-text{
  writing-mode:vertical-rl;font-size:11px;letter-spacing:.28em;color:var(--text-3);
  align-self:flex-start;padding:6px 2px;margin-left:2px;flex:none;
}
</style>
<style>
/* ============ 输入栏 ============ */
.composer{
  flex:none;display:flex;align-items:flex-end;gap:9px;
  padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);
  border-top:1px solid var(--line);background:var(--bg);
}
.composer .field{
  flex:1;display:flex;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:99px;padding:2px 6px 2px 18px;
  min-height:44px;transition:border-color .15s ease;
}
.composer .field:focus-within{border-color:var(--accent)}
.composer input{
  flex:1;border:none;outline:none;background:none;font-size:15px;min-width:0;
}
.composer input::placeholder{color:var(--text-3)}
.send-btn{
  width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--accent);color:#fdfdf9;border:1px solid var(--accent-deep);
  transition:transform .15s ease,opacity .15s ease;
}
.send-btn:active{transform:scale(.9)}
.send-btn:disabled{opacity:.4}
.send-btn svg{width:19px;height:19px;margin-left:2px}

/* ============ 来电 / 通话 ============ */
.call-layer{
  position:absolute;inset:0;z-index:40;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;text-align:center;
  background:linear-gradient(180deg,#f2f3ea 0%,#e6ead9 100%);
}
.call-layer.on{display:flex;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.call-ava{width:118px;height:118px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 12px 32px rgba(95,112,80,.25)}
.call-ava img{width:100%;height:100%;object-fit:cover}
.call-ava.ringing{animation:ringpulse 1.4s ease-in-out infinite}
@keyframes ringpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.call-name{font-family:var(--serif);font-size:24px;letter-spacing:.08em}
.call-sub{font-size:13px;color:var(--text-2);letter-spacing:.2em;min-height:20px}
.call-timer{font-variant-numeric:tabular-nums;font-size:15px;color:var(--accent-deep);letter-spacing:.15em;min-height:22px}
.call-actions{display:flex;gap:56px;margin-top:34px}
.call-btn{
  width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--text-2);
  box-shadow:var(--shadow);transition:transform .15s ease;
}
.call-btn:active{transform:scale(.92)}
.call-btn svg{width:26px;height:26px}
.call-btn.reject{background:var(--p-danger);border-color:var(--p-danger);color:#fff}
.call-btn.accept{background:var(--accent);border-color:var(--accent-deep);color:#fff}
.call-btn small{display:block;font-size:10px;margin-top:5px;color:var(--text-3)}
.call-btn-col{display:flex;flex-direction:column;align-items:center;gap:6px}

/* ============ 设置抽屉 ============ */
.scrim{
  position:absolute;inset:0;z-index:50;background:rgba(46,46,40,.32);
  opacity:0;pointer-events:none;transition:opacity .25s ease;backdrop-filter:blur(2px);
}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:absolute;top:0;right:0;bottom:0;z-index:51;width:min(88%,400px);
  background:var(--bg);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .3s cubic-bezier(.25,.9,.3,1);
  display:flex;flex-direction:column;box-shadow:-18px 0 44px rgba(46,46,40,.12);
}
.drawer.on{transform:none}
.drawer-head{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 12px;border-bottom:1px solid var(--line);
  background:var(--bg);
}
.drawer-head h2{font-family:var(--serif);font-size:17px;letter-spacing:.1em;flex:1}
.drawer-body{flex:1;overflow-y:auto;padding:14px 16px 40px;-webkit-overflow-scrolling:touch}
.set-sec{margin-bottom:22px}
.set-sec>h3{
  font-size:11px;letter-spacing:.3em;color:var(--text-3);margin:0 2px 10px;
  display:flex;align-items:center;gap:8px;
}
.set-sec>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.set-row{
  display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:48px;
  border-bottom:1px solid var(--line);
}
.set-row:last-child{border-bottom:none}
.set-row .grow{flex:1;min-width:0}
.set-row .label{font-size:14px}
.set-row .desc{font-size:11px;color:var(--text-3);margin-top:1px}
.set-row .val{font-size:12px;color:var(--text-2);text-align:right}
/* 开关 */
.switch{
  position:relative;width:46px;height:27px;flex:none;border-radius:99px;
  background:var(--p-paper-2);border:1px solid var(--line);transition:background .2s ease;
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(46,46,40,.25);transition:transform .2s ease;
}
.switch.on{background:var(--accent);border-color:var(--accent-deep)}
.switch.on::after{transform:translateX(19px)}
/* 库列表 */
.lib-item{
  display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:13px;
  border-bottom:1px solid var(--line);
}
.lib-item:last-child{border-bottom:none}
.lib-item .txt{flex:1;min-width:0;word-break:break-word}
.lib-item .grp{color:var(--accent-deep);font-size:11px;background:var(--accent-mist);border-radius:99px;padding:1px 8px;flex:none}
.del-btn{
  flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  color:var(--text-3);border:1px solid var(--line);
}
.del-btn:active{background:var(--p-danger);color:#fff;border-color:var(--p-danger)}
.del-btn svg{width:12px;height:12px}
.add-line{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--accent-mist)}
.add-line input{
  flex:1;min-width:0;border:1px solid var(--line);border-radius:99px;background:#fff;
  padding:7px 14px;font-size:13px;outline:none;
}
.add-line input:focus{border-color:var(--accent)}
.add-line button{
  flex:none;padding:0 16px;border-radius:99px;background:var(--accent);color:#fff;
  font-size:13px;border:1px solid var(--accent-deep);
}
.grp-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--accent-mist);border-bottom:1px solid var(--line);font-size:12px}
.grp-head .gname{font-weight:600;color:var(--accent-deep)}
.grp-head input[type=number]{
  width:52px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:12px;background:#fff;outline:none;text-align:center;
}
.btn-row{display:flex;gap:9px;margin-top:10px}
.btn-row .btn{
  flex:1;padding:11px 0;text-align:center;border-radius:var(--radius-s);font-size:13px;
  border:1px solid var(--line);background:var(--surface);transition:transform .15s ease;
}
.btn-row .btn:active{transform:scale(.97)}
.btn-row .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent-deep)}
.btn-row .btn.danger{color:var(--p-danger);border-color:#e0c7c2}
/* 心情日历 */
.mood-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mood-cell{
  aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9px;color:var(--text-3);
}
.mood-cell .m{font-size:15px;line-height:1}
.mood-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mood-cell.empty{background:transparent;border-style:dashed}
/* toast */
#toast{
  position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(8px);
  z-index:60;background:var(--ink);color:#f6f6f1;font-size:13px;
  padding:9px 20px;border-radius:99px;opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;white-space:nowrap;max-width:88%;
  overflow:hidden;text-overflow:ellipsis;
}
#toast.on{opacity:.94;transform:translateX(-50%)}
.empty-hint{
  text-align:center;color:var(--text-3);font-size:12px;padding:26px 0 10px;letter-spacing:.1em;
}
</style>
</head>
<body>
<div id="app">

  <!-- 信笺头 -->
  <header class="masthead">
    <svg class="rain-deco" viewBox="0 0 64 44" aria-hidden="true">
      <g fill="#8fa07a">
        <path d="M10 6c2.4 3 3.8 4.8 3.8 7a3.8 3.8 0 1 1-7.6 0c0-2.2 1.4-4 3.8-7z" opacity=".55"/>
        <path d="M50 2c2.4 3 3.8 4.8 3.8 7a3.8 3.8 0 1 1-7.6 0c0-2.2 1.4-4 3.8-7z" opacity=".8"/>
        <path d="M32 22c2.4 3 3.8 4.8 3.8 7a3.8 3.8 0 1 1-7.6 0c0-2.2 1.4-4 3.8-7z" opacity=".45"/>
        <path d="M56 26c1.8 2.2 2.8 3.6 2.8 5.2a2.8 2.8 0 1 1-5.6 0c0-1.6 1-3 2.8-5.2z" opacity=".6"/>
        <circle cx="22" cy="12" r="1.4" opacity=".5"/>
        <circle cx="44" cy="34" r="1.2" opacity=".4"/>
      </g>
    </svg>
    <div class="season">Letter from Spring</div>
    <div class="subtitle">雨季 · 春からの手紙</div>
  </header>

  <!-- 伙伴栏 -->
  <div class="peerbar">
    <div class="peer-ava" id="peerAva" title="双击拍一拍">
      <img id="peerAvaImg" src="./assets/avatar-nova.png" alt="Nova">
    </div>
    <div class="peer-info">
      <div class="peer-name"><span id="peerName">Nova</span><span class="tag" id="peerTag">ENFP · 火象狮子</span></div>
      <div class="peer-status"><span id="peerMood"></span><span class="dot" id="moodDot" style="display:none">·</span><span id="peerStatusText"></span></div>
    </div>
    <button class="icon-btn" id="btnCall" aria-label="拨打语音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
    </button>
    <button class="icon-btn" id="btnSettings" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <!-- 消息流 -->
  <main id="stream" aria-live="polite"></main>

  <!-- 输入栏 -->
  <footer class="composer">
    <div class="field">
      <input id="input" type="text" placeholder="写点什么，寄给春天…" autocomplete="off" enterkeyhint="send">
    </div>
    <button class="send-btn" id="btnSend" aria-label="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
    </button>
  </footer>

  <!-- 来电层 -->
