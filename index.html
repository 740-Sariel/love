<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Letter from Spring</title>
    
    <!-- 图标配置 (请确保同目录下有 icon.png) -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Spring","short_name":"Spring","start_url":"/","display":"standalone","icons":[{"src":"icon.png","sizes":"512x512","type":"image/png"}]}'>

    <style>
        /* ========== 基础与色彩 ========== */
        :root {
            --bg-color: #fbfbfb;
            --primary-color: #a3b899;
            --text-color: #333333;
            --text-light: #888888;
            --line-color: #e0e0e0;
            --msg-bg-other: #f2f4f1;
            --msg-bg-me: #dce6d5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
        }

        #app {
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* ========== 顶部导航 ========== */
        header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--line-color);
            background: #fff;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 16px; font-weight: normal; letter-spacing: 1px; margin: 0 auto; }
        header h1 span { color: var(--primary-color); }
        .header-left, .header-right { width: 30px; text-align: left; font-size: 20px; cursor: pointer; }
        .header-right { text-align: right; }
        
        #status-bar { font-size: 11px; color: var(--primary-color); text-align: center; padding: 5px; background: #fff; border-bottom: 1px solid var(--line-color); display: none; }

        /* ========== 聊天记录区 ========== */
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            width: 100%;
            align-items: flex-start;
            gap: 10px;
        }
        .message-row.me { flex-direction: row-reverse; }
        
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #e0e0e0;
            flex-shrink: 0;
            object-fit: cover;
            border: 1px solid var(--line-color);
        }

        .msg-content {
            max-width: 75%;
            display: flex;
            flex-direction: column;
        }
        .message-row.me .msg-content { align-items: flex-end; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }
        .message-row.other .msg-bubble { background: var(--msg-bg-other); border-top-left-radius: 2px; }
        .message-row.me .msg-bubble { background: var(--msg-bg-me); border-top-right-radius: 2px; }

        .msg-time { font-size: 10px; color: var(--text-light); margin-top: 4px; }

        /* 拍一拍特效 */
        .pat-text { font-size: 12px; color: var(--text-light); text-align: center; width: 100%; margin: 5px 0; font-style: italic; }

        /* 卡片式分割线 */
        .divider-card {
            border: 1px solid var(--line-color);
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            background: #fff;
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.6;
        }
        .divider-card .highlight { color: var(--primary-color); }

        /* ========== 底部输入区 ========== */
        footer {
            padding: 10px 15px;
            background: #fff;
            border-top: 1px solid var(--line-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        footer input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--line-color);
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background: var(--bg-color);
        }
        footer button {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: var(--primary-color);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .action-btns { display: flex; gap: 8px; }
        .action-btns button { background: #fff; border: 1px solid var(--line-color); color: var(--text-light); padding: 8px 10px; }

        /* ========== 弹窗面板通用 ========== */
        .panel {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }
        .panel.active { display: flex; }
        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px; border-bottom: 1px solid var(--line-color); background: #fff; position: sticky; top: 0; z-index: 2;
        }
        .panel-header h2 { font-size: 16px; font-weight: normal; }
        .panel-body { padding: 15px; }

        /* 设置项样式 */
        .setting-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px dashed var(--line-color); font-size: 14px;
        }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(20px); }
        
        /* 按钮样式 */
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 10px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; text-align: center; font-size: 14px; }
        .btn-primary { background: var(--primary-color); color: #fff; border: none; }

        /* 文本域 */
        textarea {
            width: 100%; padding: 10px; border: 1px solid var(--line-color); border-radius: 4px;
            font-size: 14px; font-family: inherit; resize: vertical; min-height: 150px; margin-top: 10px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid var(--line-color); border-radius: 4px; }

        /* 隐藏音频 */
        #bg-audio { display: none; }
    </style>
</head>
<body>

<div id="app">
    <!-- 顶部 -->
    <header>
        <div class="header-left" onclick="togglePanel('panel-cards')" title="字卡库">📚</div>
        <h1>- Letter from <span>Spring</span> -</h1>
        <div class="header-right" onclick="togglePanel('panel-settings')" title="设置">⚙️</div>
    </header>
    <div id="status-bar"></div>

    <!-- 聊天区 -->
    <div id="chat-container">
        <!-- 初始卡片 (头像随资料变动) -->
        <div class="divider-card">
            <div class="highlight">- Letter from Spring -</div>
            <div style="margin-top: 10px;" id="initial-profile">>>Nova·17·ENFP·火象狮子</div>
            <div style="margin-top: 15px; font-size: 12px; border-left: 2px solid var(--primary-color); padding-left: 8px; text-align: left;">
                J:<br>
                一度ほどけた糸は<br>
                どんなに必死に戻そうとしても<br>
                元のように結び直すことは困難である
            </div>
        </div>
    </div>

    <!-- 底部 -->
    <footer>
        <div class="action-btns">
            <button onclick="makeCall()" title="拨打电话">📞</button>
            <button onclick="triggerPat()" title="拍一拍">👋</button>
        </div>
        <input type="text" id="user-input" placeholder="输入消息..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">发送</button>
    </footer>

    <!-- ================= 设置面板 ================= -->
    <div id="panel-settings" class="panel">
        <div class="panel-header">
            <span style="width:20px;"></span>
            <h2>设置</h2>
            <span style="cursor:pointer; font-size: 20px;" onclick="togglePanel('panel-settings')">×</span>
        </div>
        <div class="panel-body">
            <!-- 资料设置 -->
            <h3 style="font-size: 15px; margin-bottom: 10px; color: var(--primary-color);">对方资料</h3>
            <div class="form-group">
                <label>名字 / 简介</label>
                <input type="text" id="edit-profile-text" value="Nova·17·ENFP·火象狮子">
            </div>
            <div class="form-group">
                <label>头像图片链接 (URL)</label>
                <input type="text" id="edit-avatar-url" value="https://api.iconify.design/noto:leaf-fluttering-in-wind.svg" placeholder="输入图片URL (http...)">
            </div>
            <div class="btn-group" style="margin-bottom: 20px;">
                <div class="btn btn-primary" onclick="saveProfile()">保存资料</div>
            </div>

            <!-- 系统设置 -->
            <h3 style="font-size: 15px; margin-bottom: 10px; color: var(--primary-color); border-top: 1px dashed #eee; padding-top: 15px;">系统设置</h3>
            <div class="setting-item">
                <span>后台挂活 (音频)</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-bg-audio" onchange="toggleAudio(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>弹窗通知开关</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-notification" onchange="requestNotification(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>混合模式 (Emoji与文字拼接)</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-mixed-emoji" checked onchange="config.isMixedMode = this.checked">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>数据备份与恢复</span>
                <div style="display:flex; gap:10px;">
                    <div class="btn" style="padding:5px 10px; font-size:12px;" onclick="backupData()">导出</div>
                    <input type="file" id="restore-file" accept=".json" onchange="restoreData(event)" style="display: none;">
                    <div class="btn" style="padding:5px 10px; font-size:12px;" onclick="document.getElementById('restore-file').click()">导入</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= 字卡库管理面板 ================= -->
    <div id="panel-cards" class="panel">
        <div class="panel-header">
            <span style="width:20px;"></span>
            <h2>字卡库管理</h2>
            <span style="cursor:pointer; font-size: 20px;" onclick="togglePanel('panel-cards')">×</span>
        </div>
        <div class="panel-body">
            <p style="font-size: 12px; color: var(--text-light); margin-bottom: 10px;">每行一条，支持纯文本。如果填的是图片链接(http开头)，会自动识别为表情包。</p>
            <textarea id="card-textarea" placeholder="在这里输入字卡..."></textarea>
            <div class="btn-group" style="margin-top: 15px;">
                <div class="btn btn-primary" onclick="saveCards()">保存字卡库</div>
                <div class="btn" onclick="resetCards()">恢复默认</div>
            </div>
        </div>
    </div>

    <!-- 后台音频 -->
    <audio id="bg-audio" src="https://music.163.com/song/media/outer/url?id=40249284.mp3" loop></audio>
</div>

<script>
    // ================= 数据与配置区 =================
    const defaultConfig = {
        wordCards: [
            "今天下雨了，空气里都是泥土的香气。",
            "我看着窗外的雨滴，突然很想见你。",
            "今天工作累吗？记得喝杯热水。",
            "我最近在看一本书，里面写到春日的暮色。",
            "有些话，像雨一样落下来，就收不回去了。",
            "如果思念有声音，恐怕你早已震耳欲聋。",
            "其实我不喜欢雨天，但如果是和你一起，那就没关系。",
            "晚安，明天也要好好吃饭。"
        ],
        stickerCards: [
            "https://api.iconify.design/noto:umbrella.svg",
            "https://api.iconify.design/noto:leaf-fluttering-in-wind.svg"
        ],
        emojiCards: ["🌱", "🌧️", "🍃", "☕", "💭", "🌙"],
        statusGroups: [
            { weight: 70, texts: ["正在听歌", "望着窗外发呆", "阅读中", "整理书桌"] },
            { weight: 30, texts: ["心情有些低落", "在雨中散步", "思考一些事情"] }
        ],
        moods: ["平静", "微郁", "雀跃", "慵懒", "心动"],
        profile: {
            text: "Nova·17·ENFP·火象狮子",
            avatarUrl: "https://api.iconify.design/noto:leaf-fluttering-in-wind.svg"
        },
        isMixedMode: true
    };

    // 尝试从本地存储加载配置，如果没有则使用默认
    let config = JSON.parse(localStorage.getItem('spring_config')) || JSON.parse(JSON.stringify(defaultConfig));

    // 当前用户在字卡库面板编辑的实际数据（拆分字卡和表情）
    let currentWords = [...config.wordCards];
    let currentStickers = [...config.stickerCards];

    // ================= 核心逻辑 =================
    const chatContainer = document.getElementById('chat-container');
    const bgAudio = document.getElementById('bg-audio');

    function saveToLocal() {
        localStorage.setItem('spring_config', JSON.stringify(config));
    }

    function getCurrentTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }

    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 渲染一条带头像的消息
    function addMessage(text, type, isHtml = false) {
        const row = document.createElement('div');
        row.className = `message-row ${type}`;
        
        // 头像
        const avatar = document.createElement('img');
        avatar.className = 'avatar';
        // 如果对方，用 config.profile.avatarUrl。如果是自己，用一个空白或者默认头像
        avatar.src = type === 'other' ? config.profile.avatarUrl : "https://api.iconify.design/noto:person.svg"; 
        
        // 内容容器
        const contentDiv = document.createElement('div');
        contentDiv.className = 'msg-content';

        let bubbleContent = text;
        if (!isHtml) {
            bubbleContent = `<div class="msg-bubble">${text}</div>`;
        }
        
        contentDiv.innerHTML = `${bubbleContent}<div class="msg-time">${getCurrentTime()}</div>`;
        
        row.appendChild(avatar);
        row.appendChild(contentDiv);
        chatContainer.appendChild(row);
        scrollToBottom();
    }

    function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, 'me');
        input.value = '';
        setTimeout(() => triggerReply(), 1000 + Math.random() * 1500);
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // ================= 概率与随机逻辑 =================
    function triggerPat() {
        addMessage(`<div class="pat-text">“你” 拍了拍 “${config.profile.text.split('·')[0]}” 的肩膀</div>`, 'other', true);
        sendNotification(config.profile.text.split('·')[0], "拍了拍你");
    }

    function triggerReply() {
        const rand = Math.random();
        let count = 1;
        if (rand < 0.75) count = 1;
        else if (rand < 0.95) count = 2;
        else count = 3;

        updateStatus();

        let delay = 0;
        for (let i = 0; i < count; i++) {
            setTimeout(() => sendCard(), delay);
            delay += 800 + Math.random() * 500;
        }
    }

    function sendCard() {
        // 如果字卡库为空，不发送
        if (config.wordCards.length === 0 && config.stickerCards.length === 0) return;

        // 随机决定发文字还是表情包
        const totalPool = config.wordCards.length + config.stickerCards.length;
        const randomIndex = Math.floor(Math.random() * totalPool);
        
        let textToSend = "";
        let isSticker = false;

        if (randomIndex < config.wordCards.length) {
            // 发文字
            textToSend = config.wordCards[randomIndex];
        } else {
            // 发表情
            textToSend = config.stickerCards[randomIndex - config.wordCards.length];
            isSticker = true;
        }

        let finalHtml = textToSend;
        let extraMessage = "";

        // 如果是文字，判断是否加 Emoji
        if (!isSticker && Math.random() < 0.2 && config.emojiCards.length > 0) {
            const emoji = config.emojiCards[Math.floor(Math.random() * config.emojiCards.length)];
            if (config.isMixedMode) {
                if (Math.random() < 0.5) finalHtml = emoji + textToSend;
                else finalHtml = textToSend + emoji;
            } else {
                extraMessage = emoji;
            }
        }

        // 渲染
        if (isSticker) {
            addMessage(`<img src="${textToSend}" style="max-width: 120px; border-radius: 8px; border: 1px solid #eee;">`, 'other', true);
        } else {
            addMessage(finalHtml, 'other');
        }

        // 附带表情包 (原本独立 20% 概率，这里加了限制：如果刚发完表情，就不再紧跟着发表情，免得刷屏)
        if (!isSticker && Math.random() < 0.2 && config.stickerCards.length > 0) {
            const stickerUrl = config.stickerCards[Math.floor(Math.random() * config.stickerCards.length)];
            setTimeout(() => {
                addMessage(`<img src="${stickerUrl}" style="max-width: 120px; border-radius: 8px; border: 1px solid #eee;">`, 'other', true);
            }, 600);
        }

        if (extraMessage) {
            setTimeout(() => addMessage(extraMessage, 'other'), 400);
        }

        sendNotification(config.profile.text.split('·')[0], isSticker ? "[图片]" : finalHtml);
    }

    function updateStatus() {
        const rand = Math.random() * 100;
        let selectedGroup = config.statusGroups[0];
        if (rand > 70) selectedGroup = config.statusGroups[1];
        
        const randomStatus = selectedGroup.texts[Math.floor(Math.random() * selectedGroup.texts.length)];
        document.getElementById('status-bar').style.display = 'block';
        document.getElementById('status-bar').innerText = `当前状态：${randomStatus}`;
    }

    function makeCall() {
        const isHangup = Math.random() < 0.35;
        if (isHangup) {
            addMessage(`<div class="divider-card">[通话已挂断] 嘟...嘟...</div>`, 'other', true);
        } else {
            addMessage(`<div class="divider-card">[通话中] ${config.profile.text.split('·')[0]}: 喂？怎么了？</div>`, 'other', true);
        }
    }

    // ================= 界面控制与面板逻辑 =================
    function togglePanel(panelId) {
        const panel = document.getElementById(panelId);
        panel.classList.toggle('active');
        
        if (panelId === 'panel-settings') {
            // 打开设置时，同步一下当前的资料
            document.getElementById('edit-profile-text').value = config.profile.text;
            document.getElementById('edit-avatar-url').value = config.profile.avatarUrl;
        } else if (panelId === 'panel-cards') {
            // 打开字卡时，将数据加载到文本框。将字卡和表情合并显示
            const allCards = [...config.wordCards, ...config.stickerCards];
            document.getElementById('card-textarea').value = allCards.join('\n');
        }
    }

    // 保存资料
    function saveProfile() {
        config.profile.text = document.getElementById('edit-profile-text').value.trim() || "Nova";
        config.profile.avatarUrl = document.getElementById('edit-avatar-url').value.trim() || defaultConfig.profile.avatarUrl;
        
        // 更新初始卡片
        document.getElementById('initial-profile').innerText = `>>${config.profile.text}`;
        
        saveToLocal();
        alert("资料已保存！");
    }

    // 保存字卡库
    function saveCards() {
        const rawText = document.getElementById('card-textarea').value;
        const lines = rawText.split('\n').map(line => line.trim()).filter(line => line !== '');
        
        // 自动识别 http 开头的为图片（表情包），其余为文本
        const newWords = [];
        const newStickers = [];
        
        lines.forEach(line => {
            if (line.startsWith('http://') || line.startsWith('https://')) {
                newStickers.push(line);
            } else {
                newWords.push(line);
            }
        });

        config.wordCards = newWords;
        config.stickerCards = newStickers;
        saveToLocal();
        alert(`字卡保存成功！\n文本：${newWords.length} 条\n图片：${newStickers.length} 条`);
        togglePanel('panel-cards');
    }

    // 恢复默认字卡
    function resetCards() {
        if(confirm("确定要恢复默认字卡库吗？你添加的字卡会丢失！")) {
            config.wordCards = [...defaultConfig.wordCards];
            config.stickerCards = [...defaultConfig.stickerCards];
            saveToLocal();
            
            const allCards = [...config.wordCards, ...config.stickerCards];
            document.getElementById('card-textarea').value = allCards.join('\n');
            alert("已恢复默认。");
        }
    }

    // 音频与通知
    function toggleAudio(isChecked) {
        if (isChecked) {
            bgAudio.play().catch(e => alert("请先与页面交互一次再开启音频"));
        } else {
            bgAudio.pause();
        }
    }

    function requestNotification(isChecked) {
        if (isChecked) {
            if (!("Notification" in window)) return alert("当前浏览器不支持通知");
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("Spring 通知测试", { body: "通知功能已成功开启！" });
                } else {
                    document.getElementById('toggle-notification').checked = false;
                }
            });
        }
    }

    function sendNotification(title, body) {
        if (Notification.permission === "granted") {
            new Notification(title, { body: body, icon: config.profile.avatarUrl });
        }
    }

    // 备份与恢复
    function backupData() {
        const data = {
            config: config,
            chatHtml: chatContainer.innerHTML // 把聊天记录也存下来
        };
        const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `spring_backup_${new Date().getTime()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function restoreData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.config) {
                    config = data.config;
                    saveToLocal();
                }
                if (data.chatHtml) {
                    chatContainer.innerHTML = data.chatHtml;
                    scrollToBottom();
                }
                alert("数据恢复成功！");
                togglePanel('panel-settings');
            } catch (err) {
                alert("文件损坏，无法恢复");
            }
        };
        reader.readAsText(file);
    }

    // 初始化
    window.onload = function() {
        // 同步界面上的初始资料
        document.getElementById('initial-profile').innerText = `>>${config.profile.text}`;
        // 设置混合模式状态
        document.getElementById('toggle-mixed-emoji').checked = config.isMixedMode;
    };
</script>

</body>
</html>
