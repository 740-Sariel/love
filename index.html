<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Letter from Spring</title>
    <style>
        /* ========== 基础与色彩 (清新文艺风) ========== */
        :root {
            --bg-color: #fbfbfb;
            --primary-color: #a3b899; /* 浅草绿 */
            --text-color: #333333;
            --text-light: #888888;
            --line-color: #e0e0e0;
            --msg-bg-other: #f2f4f1;
            --msg-bg-me: #dce6d5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
        }

        /* 手机屏幕容器 (9:16 适配 1206x2622) */
        #app {
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* ========== 顶部导航 ========== */
        header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--line-color);
            background: #fff;
            z-index: 10;
        }
        header h1 { font-size: 16px; font-weight: normal; letter-spacing: 1px; }
        header h1 span { color: var(--primary-color); }
        .header-sub { font-size: 11px; color: var(--text-light); margin-top: 5px; }
        .settings-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 20px;
            color: var(--text-light);
            cursor: pointer;
        }

        /* ========== 聊天记录区 ========== */
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message { max-width: 80%; display: flex; flex-direction: column; }
        .message.other { align-self: flex-start; }
        .message.me { align-self: flex-end; align-items: flex-end; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.other .msg-bubble { background: var(--msg-bg-other); border-top-left-radius: 2px; }
        .message.me .msg-bubble { background: var(--msg-bg-me); border-top-right-radius: 2px; }

        .msg-time { font-size: 10px; color: var(--text-light); margin-top: 4px; }

        /* 拍一拍特效 */
        .pat-text { font-size: 12px; color: var(--text-light); text-align: center; width: 100%; margin: 10px 0; font-style: italic; }

        /* 卡片式分割线 (还原图片) */
        .divider-card {
            border: 1px solid var(--line-color);
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            background: #fff;
            text-align: center;
            font-size: 13px;
            color: var(--text-light);
            line-height: 1.6;
        }
        .divider-card .highlight { color: var(--primary-color); }

        /* ========== 底部输入区 ========== */
        footer {
            padding: 10px 15px;
            background: #fff;
            border-top: 1px solid var(--line-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        footer input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--line-color);
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background: var(--bg-color);
        }
        footer button {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: var(--primary-color);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .action-btns { display: flex; gap: 8px; }
        .action-btns button { background: #fff; border: 1px solid var(--line-color); color: var(--text-light); padding: 8px 10px; }

        /* ========== 设置面板 (弹窗) ========== */
        #settings-panel {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        #settings-panel.active { display: flex; }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px dashed var(--line-color);
            font-size: 14px;
        }
        /* 开关样式 */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(20px); }
        .close-btn { margin-top: 20px; text-align: center; padding: 10px; background: var(--primary-color); color: #fff; border-radius: 4px; cursor: pointer; }

        /* 隐藏的音频 */
        #bg-audio { display: none; }

        /* 状态显示 */
        #status-bar { font-size: 11px; color: var(--primary-color); text-align: center; padding: 5px; background: #fff; border-bottom: 1px solid var(--line-color); display: none; }
    </style>
<!-- 网站标题 -->
    <title>Letter from Spring</title>
    
    <!-- ====== 添加下面这几行代码 ====== -->
    <!-- 标准网页图标 (适用于浏览器标签页) -->
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- 苹果设备 (iOS) 添加到主屏幕的图标 -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<div id="app">
    <!-- 顶部 -->
    <header>
        <h1>- Letter from <span>Spring</span> -</h1>
        <div class="header-sub">人的一生，会有太多个雨季</div>
        <div class="settings-btn" onclick="toggleSettings()">⚙️</div>
    </header>
    <div id="status-bar"></div>

    <!-- 聊天区 -->
    <div id="chat-container">
        <!-- 初始卡片 -->
        <div class="divider-card">
            <div class="highlight">- Letter from Spring -</div>
            <div style="margin-top: 10px;">>>Nova·17·ENFP·火象狮子</div>
            <div style="margin-top: 15px; font-size: 12px; border-left: 2px solid var(--primary-color); padding-left: 8px; text-align: left;">
                J:<br>
                一度ほどけた糸は<br>
                どんなに必死に戻そうとしても<br>
                元のように結び直すことは困難である
            </div>
        </div>
        <div class="divider-card">
            >>虐恋风格·温病·引导·剖析·涉三
        </div>
    </div>

    <!-- 底部 -->
    <footer>
        <div class="action-btns">
            <button onclick="makeCall()" title="拨打电话">📞</button>
            <button onclick="triggerPat()" title="拍一拍">👋</button>
        </div>
        <input type="text" id="user-input" placeholder="输入消息..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">发送</button>
    </footer>

    <!-- 设置面板 -->
    <div id="settings-panel">
        <h2 style="font-size: 18px; margin-bottom: 20px; font-weight: normal;">设置</h2>
        <div class="setting-item">
            <span>后台挂活 (音频)</span>
            <label class="switch">
                <input type="checkbox" id="toggle-bg-audio" onchange="toggleAudio(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-item">
            <span>弹窗通知开关</span>
            <label class="switch">
                <input type="checkbox" id="toggle-notification" onchange="requestNotification(this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-item">
            <span>混合模式 (Emoji与文字拼接)</span>
            <label class="switch">
                <input type="checkbox" id="toggle-mixed-emoji" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="setting-item" style="flex-direction: column; align-items: flex-start;">
            <span>数据备份与恢复</span>
            <div style="margin-top: 10px; display: flex; gap: 10px; width: 100%;">
                <button onclick="backupData()" style="flex:1; padding:10px; border:1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer;">导出备份</button>
                <input type="file" id="restore-file" accept=".json" onchange="restoreData(event)" style="display: none;">
                <button onclick="document.getElementById('restore-file').click()" style="flex:1; padding:10px; border:1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer;">导入备份</button>
            </div>
        </div>
        <div class="close-btn" onclick="toggleSettings()">完成</div>
    </div>

    <!-- 后台音频 (外链网易云) -->
    <audio id="bg-audio" src="https://music.163.com/song/media/outer/url?id=40249284.mp3" loop></audio>
</div>

<script>
    // ================= 数据与配置区 (字卡库) =================
    // 你可以在这里无限添加你的句子、表情包URL、Emoji和状态
    const config = {
        // 字卡库 (随机组合)
        wordCards: [
            "今天下雨了，空气里都是泥土的香气。",
            "我看着窗外的雨滴，突然很想见你。",
            "今天工作累吗？记得喝杯热水。",
            "我最近在看一本书，里面写到春日的暮色。",
            "有些话，像雨一样落下来，就收不回去了。",
            "如果思念有声音，恐怕你早已震耳欲聋。",
            "其实我不喜欢雨天，但如果是和你一起，那就没关系。",
            "晚安，明天也要好好吃饭。"
        ],
        // 表情包URL库 (为空则不会触发)
        stickerCards: [
            "https://api.iconify.design/noto:umbrella.svg",
            "https://api.iconify.design/noto:leaf-fluttering-in-wind.svg"
        ],
        // Emoji库
        emojiCards: ["🌱", "🌧️", "🍃", "☕", "💭", "🌙"],
        // 状态库 (带分组权重 - 模拟)
        statusGroups: [
            { weight: 70, texts: ["正在听歌", "望着窗外发呆", "阅读中", "整理书桌"] },
            { weight: 30, texts: ["心情有些低落", "在雨中散步", "思考一些事情"] }
        ],
        // 心情库 (mood)
        moods: ["平静", "微郁", "雀跃", "慵懒", "心动"],
        // 当前状态
        currentStatus: "",
        isMixedMode: true
    };

    // ================= 核心逻辑 =================
    const chatContainer = document.getElementById('chat-container');
    const bgAudio = document.getElementById('bg-audio');

    // 获取当前时间
    function getCurrentTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }

    // 滚动到底部
    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 发送用户消息
    function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'me');
        input.value = '';

        // 用户发消息后，模拟对方回复
        setTimeout(() => {
            triggerReply();
        }, 1000 + Math.random() * 1500);
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // 添加消息到界面
    function addMessage(text, type, isHtml = false) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        
        let htmlContent = text;
        if (!isHtml) {
            htmlContent = `<div class="msg-bubble">${text}</div>`;
        }
        
        div.innerHTML = `${htmlContent}<div class="msg-time">${getCurrentTime()}</div>`;
        chatContainer.appendChild(div);
        scrollToBottom();
    }

    // ================= 概率与核心算法 =================
    // ② 拍一拍 (3%)
    function triggerPat() {
        addMessage(`<div class="pat-text">“你” 拍了拍 “Nova” 的肩膀</div>`, 'other', true);
        // 发送通知
        sendNotification("Nova", "拍了拍你");
    }

    // ③ 发几条字卡 (1条:75%, 2条:20%, 3条:5%)
    function triggerReply() {
        const rand = Math.random();
        let count = 1;
        if (rand < 0.75) count = 1;
        else if (rand < 0.95) count = 2;
        else count = 3;

        // 对方状态更新
        updateStatus();

        // 连续发送多条
        let delay = 0;
        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                sendCard();
            }, delay);
            delay += 800 + Math.random() * 500; // 每条间隔
        }
    }

    // 发送单条字卡 (包含概率判定)
    function sendCard() {
        const randomSentence = config.wordCards[Math.floor(Math.random() * config.wordCards.length)];
        let finalText = randomSentence;
        let extraMessage = "";

        // ⑤ 附带 Emoji (20% 概率)
        if (Math.random() < 0.2 && config.emojiCards.length > 0) {
            const emoji = config.emojiCards[Math.floor(Math.random() * config.emojiCards.length)];
            if (config.isMixedMode) {
                // 混合模式 (前后各 50%)
                if (Math.random() < 0.5) finalText = emoji + finalText;
                else finalText = finalText + emoji;
            } else {
                // 单独一条 (处理稍后发送)
                extraMessage = emoji;
            }
        }

        // 渲染文本
        addMessage(finalText, 'other');

        // ④ 附带表情包 (20% 概率，独立判断)
        if (Math.random() < 0.2 && config.stickerCards.length > 0) {
            const stickerUrl = config.stickerCards[Math.floor(Math.random() * config.stickerCards.length)];
            // 延时发图片
            setTimeout(() => {
                addMessage(`<img src="${stickerUrl}" style="max-width: 100px; border-radius: 8px;">`, 'other', true);
            }, 600);
        }

        // 如果不是混合模式，发单独 Emoji
        if (extraMessage) {
            setTimeout(() => {
                addMessage(extraMessage, 'other');
            }, 400);
        }

        // 发送通知
        sendNotification("Nova", finalText);
    }

    // ⑦ 对方状态更新 (1~8 小时)
    function updateStatus() {
        // 模拟权重选择
        const rand = Math.random() * 100;
        let selectedGroup = config.statusGroups[0]; // 默认
        if (rand > 70) selectedGroup = config.statusGroups[1];
        
        const randomStatus = selectedGroup.texts[Math.floor(Math.random() * selectedGroup.texts.length)];
        config.currentStatus = randomStatus;
        
        const statusBar = document.getElementById('status-bar');
        statusBar.style.display = 'block';
        statusBar.innerText = `当前状态：${randomStatus}`;

        // 真实场景下使用 setInterval，这里为了演示，每触发一次回复就刷新一次
        // 定时器逻辑：
        // setTimeout(() => updateStatus(), (1 + Math.random() * 7) * 60 * 60 * 1000);
    }

    // ⑧ 心情日历 (每天首次加载)
    function initMood() {
        if (Math.random() < 0.20) {
            console.log("今日无心情卡片");
        } else {
            const mood = config.moods[Math.floor(Math.random() * config.moods.length)];
            console.log(`今日心情：${mood}`);
            // 你可以在这里把心情渲染到界面上，例如插入到聊天的第一条。
            addMessage(`<div class="divider-card" style="text-align:center; padding: 10px;">今日心情：${mood}</div>`, 'other', true);
        }
    }

    // ⑨ 电话与拍一拍
    function makeCall() {
        // 拨打过去，35% 概率被挂断
        const isHangup = Math.random() < 0.35;
        if (isHangup) {
            addMessage(`<div class="divider-card">[通话已挂断] 嘟...嘟...</div>`, 'other', true);
        } else {
            addMessage(`<div class="divider-card">[通话中] Nova: 喂？怎么了？</div>`, 'other', true);
        }
    }

    // 随机触发来电 (每15~60分钟)
    // 为了演示，我把它写成了一个长定时器，真实环境请保留
    function scheduleIncomingCall() {
        const interval = (15 + Math.random() * 45) * 60 * 1000; // 15~60分钟
        setTimeout(() => {
            if (Math.random() < 0.25) {
                // 25% 发起来电
                addMessage(`<div class="divider-card" style="color: var(--primary-color);">📞 来电：Nova 正在呼叫你...</div>`, 'other', true);
                sendNotification("Nova", "来电呼叫");
                // 模拟接听/挂断逻辑可以后续补充
            }
            scheduleIncomingCall(); // 递归继续下一次
        }, interval);
    }

    // 初始化定时器
    // 如果你要测试电话，可以把上面的时间改为 1000 (1秒)

    // ================= 设置与系统功能 =================
    function toggleSettings() {
        const panel = document.getElementById('settings-panel');
        panel.classList.toggle('active');
    }

    // 后台挂活音频
    function toggleAudio(isChecked) {
        if (isChecked) {
            bgAudio.play().catch(e => console.log("音频播放被浏览器拦截，请与用户交互后重试"));
        } else {
            bgAudio.pause();
        }
    }

    // 弹窗通知
    function requestNotification(isChecked) {
        if (isChecked) {
            if (!("Notification" in window)) {
                alert("当前浏览器不支持桌面通知");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    // 立即发送一个测试通知
                    new Notification("Spring 通知测试", { body: "通知功能已成功开启！" });
                } else {
                    document.getElementById('toggle-notification').checked = false;
                }
            });
        }
    }

    function sendNotification(title, body) {
        if (Notification.permission === "granted") {
            new Notification(title, { body: body, icon: "https://api.iconify.design/noto:leaf-fluttering-in-wind.svg" });
        }
    }

    // 备份与恢复
    function backupData() {
        // 备份聊天记录
        const messages = chatContainer.innerHTML;
        const data = {
            messages: messages,
            config: config
        };
        const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `spring_backup_${new Date().getTime()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function restoreData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.messages) {
                    chatContainer.innerHTML = data.messages;
                    scrollToBottom();
                }
                if (data.config) {
                    Object.assign(config, data.config);
                }
                alert("数据恢复成功！");
            } catch (err) {
                alert("文件损坏，无法恢复");
            }
        };
        reader.readAsText(file);
    }

    // 初始化
    window.onload = function() {
        initMood();
        scheduleIncomingCall();
        // 混合模式监听
        document.getElementById('toggle-mixed-emoji').addEventListener('change', (e) => {
            config.isMixedMode = e.target.checked;
        });
        // 初始化状态
        updateStatus();
    };
</script>

</body>
</html>
