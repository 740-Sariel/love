<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Letter from Spring</title>
    
    <!-- ====== 图标配置 (请确保你的 icon.png 和网页在同一目录) ====== -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href='data:application/manifest+json,{"name":"Spring","short_name":"Spring","start_url":"/","display":"standalone","icons":[{"src":"icon.png","sizes":"512x512","type":"image/png"}]}'>
    <!-- ====================== -->

    <style>
        /* ========== 基础与色彩 (清新文艺风) ========== */
        :root {
            --bg-color: #fbfbfb;
            --primary-color: #a3b899; /* 浅草绿 */
            --text-color: #333333;
            --text-light: #888888;
            --line-color: #e0e0e0;
            --msg-bg-other: #f2f4f1;
            --msg-bg-me: #dce6d5;
            --avatar-size: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif; }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
        }

        /* 手机屏幕容器 (9:16 适配) */
        #app {
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * (9 / 16));
            max-height: calc(100vw * (16 / 9));
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* ========== 顶部导航 ========== */
        header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid var(--line-color);
            background: #fff;
            z-index: 10;
            position: relative;
        }
        header h1 { font-size: 16px; font-weight: normal; letter-spacing: 1px; }
        header h1 span { color: var(--primary-color); }
        .header-sub { font-size: 11px; color: var(--text-light); margin-top: 5px; }
        .settings-btn {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 20px;
            color: var(--text-light);
            cursor: pointer;
        }

        /* ========== 聊天记录区 ========== */
        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px; /* 增加一点点间距更透气 */
            scroll-behavior: smooth;
        }

        /* 全局居中卡片 (用于系统提示、封面语) */
        .divider-card {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: var(--text-light);
            line-height: 1.6;
            margin: 10px 0;
            padding: 0 10px;
        }
        .divider-card .highlight { color: var(--primary-color); font-size: 14px; letter-spacing: 1px; }

        /* 消息行结构 */
        .message-row {
            display: flex;
            align-items: flex-start;
            max-width: 85%;
            gap: 8px;
        }
        .message-row.other { align-self: flex-start; }
        .message-row.me { align-self: flex-end; flex-direction: row-reverse; }

        /* 头像 (使用 CSS 绘制默认图形，绝不裂图) */
        .avatar {
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            background-color: var(--primary-color);
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            border: 1px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            /* 默认背景为浅绿，如果是图片链接会覆盖 */
        }
        /* 默认自己头像：纯白底色带个深色小圆点 */
        .avatar.me { 
            background-color: #e5e5e5; 
            position: relative;
        }
        .avatar.me::after {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 12px; height: 12px; border-radius: 50%; background: #999;
        }

        /* 消息内容 */
        .message-content {
            display: flex;
            flex-direction: column;
        }
        .message-row.other .message-content { align-items: flex-start; }
        .message-row.me .message-content { align-items: flex-end; }

        /* 昵称 */
        .nickname {
            font-size: 11px;
            color: var(--text-light);
            margin-bottom: 4px;
            padding: 0 4px;
        }

        /* 气泡 */
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            max-width: 100%;
        }
        .message-row.other .msg-bubble { background: var(--msg-bg-other); border-top-left-radius: 2px; }
        .message-row.me .msg-bubble { background: var(--msg-bg-me); border-top-right-radius: 2px; }

        .msg-time { font-size: 10px; color: var(--text-light); margin-top: 4px; padding: 0 4px; }

        /* 拍一拍特效 */
        .pat-text { font-size: 12px; color: var(--text-light); text-align: center; width: 100%; margin: 10px 0; font-style: italic; }

        /* ========== 底部输入区 ========== */
        footer {
            padding: 10px 15px;
            background: #fff;
            border-top: 1px solid var(--line-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        footer input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--line-color);
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background: var(--bg-color);
        }
        footer button {
            padding: 10px 15px;
            border: none;
            border-radius: 20px;
            background: var(--primary-color);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .action-btns { display: flex; gap: 8px; }
        .action-btns button { background: #fff; border: 1px solid var(--line-color); color: var(--text-light); padding: 8px 10px; }

        /* ========== 设置面板 ========== */
        #settings-panel {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        #settings-panel.active { display: flex; }
        
        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--line-color); padding-bottom: 10px;}
        .settings-header h2 { font-size: 18px; font-weight: normal; }
        .settings-header .close-btn { font-size: 24px; color: var(--text-light); cursor: pointer; }

        /* 标签页 */
        .tabs { display: flex; gap: 15px; margin-bottom: 15px; }
        .tab { padding: 5px 10px; font-size: 14px; color: var(--text-light); cursor: pointer; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px dashed var(--line-color);
            font-size: 14px;
        }
        
        /* 输入框和文本域 */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 5px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--line-color);
            border-radius: 4px;
            font-size: 13px;
            background: var(--bg-color);
            outline: none;
        }
        .form-group textarea { resize: vertical; min-height: 100px; }
        .save-btn { width: 100%; padding: 12px; background: var(--primary-color); color: #fff; border: none; border-radius: 4px; margin-top: 10px; cursor: pointer;}

        /* 开关样式 */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        #bg-audio { display: none; }
        #status-bar { font-size: 11px; color: var(--primary-color); text-align: center; padding: 5px; background: #fff; border-bottom: 1px solid var(--line-color); display: none; }
    </style>
</head>
<body>

<div id="app">
    <!-- 顶部 -->
    <header>
        <h1>- Letter from <span>Spring</span> -</h1>
        <div class="header-sub" id="header-sub-text">人的一生，会有太多个雨季</div>
        <div class="settings-btn" onclick="toggleSettings()">⚙️</div>
    </header>
    <div id="status-bar"></div>

    <!-- 聊天区 -->
    <div id="chat-container">
        <!-- 渲染区 (由 JS 动态生成) -->
    </div>

    <!-- 底部 -->
    <footer>
        <div class="action-btns">
            <button onclick="makeCall()" title="拨打电话">📞</button>
            <button onclick="triggerPat()" title="拍一拍">👋</button>
        </div>
        <input type="text" id="user-input" placeholder="输入消息..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">发送</button>
    </footer>

    <!-- 设置面板 -->
    <div id="settings-panel">
        <div class="settings-header">
            <h2>设置与管理</h2>
            <div class="close-btn" onclick="toggleSettings()">×</div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('tab-system', this)">系统设置</div>
            <div class="tab" onclick="switchTab('tab-profile', this)">角色资料</div>
            <div class="tab" onclick="switchTab('tab-cards', this)">字卡库</div>
        </div>

        <!-- 系统设置 -->
        <div id="tab-system" class="tab-content active">
            <div class="setting-item">
                <span>后台挂活 (音频)</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-bg-audio" onchange="toggleAudio(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>弹窗通知开关</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-notification" onchange="requestNotification(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>混合模式 (Emoji与文字拼接)</span>
                <label class="switch">
                    <input type="checkbox" id="toggle-mixed-emoji" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="form-group" style="margin-top: 20px;">
                <label>数据备份与恢复</label>
                <div style="display: flex; gap: 10px;">
                    <button onclick="backupData()" style="flex:1; padding:10px; border:1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer;">导出备份</button>
                    <input type="file" id="restore-file" accept=".json" onchange="restoreData(event)" style="display: none;">
                    <button onclick="document.getElementById('restore-file').click()" style="flex:1; padding:10px; border:1px solid #ccc; background:#fff; border-radius:4px; cursor:pointer;">导入备份</button>
                </div>
            </div>
        </div>

        <!-- 角色资料 -->
        <div id="tab-profile" class="tab-content">
            <div class="form-group">
                <label>对方昵称</label>
                <input type="text" id="profile-nickname" placeholder="Nova">
            </div>
            <div class="form-group">
                <label>对方头像图片链接 (留空则使用纯绿默认头像)</label>
                <input type="text" id="profile-avatar" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>对方状态/签名 (顶部小字)</label>
                <input type="text" id="profile-status" placeholder="人的一生，会有太多个雨季">
            </div>
            <button class="save-btn" onclick="saveProfile()">保存资料</button>
        </div>

        <!-- 字卡库 -->
        <div id="tab-cards" class="tab-content">
            <div class="form-group">
                <label>字卡句子 (每行一条)</label>
                <textarea id="textarea-words" placeholder="今天下雨了...&#10;你还好吗？"></textarea>
            </div>
            <div class="form-group">
                <label>表情包图片链接 (每行一个，留空则不发)</label>
                <textarea id="textarea-stickers" placeholder="https://.../1.png"></textarea>
            </div>
            <button class="save-btn" onclick="saveCards()">保存字卡库</button>
        </div>
    </div>

    <!-- 后台音频 -->
    <audio id="bg-audio" src="https://music.163.com/song/media/outer/url?id=40249284.mp3" loop></audio>
</div>

<script>
    // ================= 数据与配置区 =================
    const defaultConfig = {
        wordCards: [
            "今天下雨了，空气里都是泥土的香气。",
            "我看着窗外的雨滴，突然很想见你。",
            "今天工作累吗？记得喝杯热水。",
            "我最近在看一本书，里面写到春日的暮色。",
            "有些话，像雨一样落下来，就收不回去了。",
            "如果思念有声音，恐怕你早已震耳欲聋。",
            "其实我不喜欢雨天，但如果是和你一起，那就没关系。",
            "晚安，明天也要好好吃饭。"
        ],
        stickerCards: [
            "https://api.iconify.design/noto:umbrella.svg"
        ],
        emojiCards: ["🌱", "🌧️", "🍃", "☕", "💭", "🌙"],
        statusGroups: [
            { weight: 70, texts: ["正在听歌", "望着窗外发呆", "阅读中"] },
            { weight: 30, texts: ["心情有些低落", "在雨中散步"] }
        ],
        isMixedMode: true,
        profile: {
            nickname: "Nova",
            avatar: "", // 留空表示用 CSS 绿底
            headerSub: "人的一生，会有太多个雨季"
        }
    };

    // 读取本地配置
    let config = JSON.parse(localStorage.getItem('spring_config')) || defaultConfig;
    // 读取本地聊天记录
    let savedChat = localStorage.getItem('spring_chat') || '';

    const chatContainer = document.getElementById('chat-container');
    const bgAudio = document.getElementById('bg-audio');

    // 获取当前时间
    function getCurrentTime() {
        const now = new Date();
        return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    }

    // 滚动到底部
    function scrollToBottom() {
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // 保存聊天记录
    function saveChat() {
        localStorage.setItem('spring_chat', chatContainer.innerHTML);
    }

    // 初始化聊天界面 (重绘)
    function renderChat() {
        // 先放一条封面卡片
        let coverHtml = `
            <div class="divider-card">
                <div class="highlight">- Letter from Spring -</div>
                <div style="margin-top: 8px;">>>${config.profile.nickname}Sariel</div>
                <div style="margin-top: 15px; font-size: 12px; border-left: 2px solid var(--primary-color); padding-left: 10px; text-align: left; max-width: 80%; margin-left: auto; margin-right: auto;">
                    冬夜很长，但你在我身边，就无需担忧风雪<br>
                    <span style="color:#aaa; font-size:10px; margin-top:5px; display:inline-block;">(愿望可以更贪心、更古怪一些。我有九条尾巴，足够接住你念九次一生一世)</span>
                </div>
            </div>
            <div class="divider-card"> >> 此间两心同 </div>
        `;
        
        // 如果有历史记录，先塞封面，再塞记录
        if (savedChat) {
            chatContainer.innerHTML = coverHtml + savedChat;
        } else {
            chatContainer.innerHTML = coverHtml;
        }
        scrollToBottom();
    }

    // 发送用户消息
    function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'me');
        input.value = '';

        // 模拟回复
        setTimeout(() => {
            triggerReply();
        }, 1000 + Math.random() * 1500);
    }

    function handleEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // 添加消息到界面
    function addMessage(text, type, isHtml = false) {
        const row = document.createElement('div');
        row.className = `message-row ${type}`;
        
        let htmlContent = text;
        if (!isHtml) {
            htmlContent = `<div class="msg-bubble">${text}</div>`;
        }

        // 判断头像
        let avatarStyle = "";
        if (type === 'other') {
            if (config.profile.avatar) {
                avatarStyle = `background-image: url('${config.profile.avatar}');`;
            } // 否则使用 CSS 默认绿色
        } else {
            avatarStyle = ""; // 自己用 CSS 默认灰色
        }

        let nickname = type === 'other' ? config.profile.nickname : '我';

        row.innerHTML = `
            <div class="avatar ${type}" style="${avatarStyle}"></div>
            <div class="message-content">
                <div class="nickname">${nickname}</div>
                ${htmlContent}
                <div class="msg-time">${getCurrentTime()}</div>
            </div>
        `;
        chatContainer.appendChild(row);
        scrollToBottom();
        saveChat(); // 每次发消息都保存
    }

    // ================= 概率与核心算法 =================
    function triggerPat() {
        const div = document.createElement('div');
        div.className = 'pat-text';
        div.innerHTML = `“你” 拍了拍 “${config.profile.nickname}” 的肩膀`;
        chatContainer.appendChild(div);
        scrollToBottom();
        saveChat();
        sendNotification(config.profile.nickname, "拍了拍你");
    }

    function triggerReply() {
        const rand = Math.random();
        let count = 1;
        if (rand < 0.75) count = 1;
        else if (rand < 0.95) count = 2;
        else count = 3;

        let delay = 0;
        for (let i = 0; i < count; i++) {
            setTimeout(() => {
                sendCard();
            }, delay);
            delay += 800 + Math.random() * 500;
        }
    }

    function sendCard() {
        if (config.wordCards.length === 0) return;
        const randomSentence = config.wordCards[Math.floor(Math.random() * config.wordCards.length)];
        let finalText = randomSentence;
        let extraMessage = "";

        if (Math.random() < 0.2 && config.emojiCards.length > 0) {
            const emoji = config.emojiCards[Math.floor(Math.random() * config.emojiCards.length)];
            if (config.isMixedMode) {
                if (Math.random() < 0.5) finalText = emoji + finalText;
                else finalText = finalText + emoji;
            } else {
                extraMessage = emoji;
            }
        }

        addMessage(finalText, 'other');

        if (Math.random() < 0.2 && config.stickerCards.length > 0) {
            const stickerUrl = config.stickerCards[Math.floor(Math.random() * config.stickerCards.length)];
            setTimeout(() => {
                // 简单的判断，如果是图片链接
                addMessage(`<img src="${stickerUrl}" style="max-width: 120px; border-radius: 8px;">`, 'other', true);
            }, 600);
        }

        if (extraMessage) {
            setTimeout(() => {
                addMessage(extraMessage, 'other');
            }, 400);
        }

        sendNotification(config.profile.nickname, finalText);
    }

    function makeCall() {
        const isHangup = Math.random() < 0.35;
        if (isHangup) {
            addMessage(`<div class="divider-card">[通话已挂断] 嘟...嘟...</div>`, 'other', true);
        } else {
            addMessage(`<div class="divider-card" style="color: var(--primary-color);">[通话中] ${config.profile.nickname}: 喂？怎么了？</div>`, 'other', true);
        }
    }

    // ================= 设置与系统功能 =================
    function toggleSettings() {
        const panel = document.getElementById('settings-panel');
        panel.classList.toggle('active');
        if(panel.classList.contains('active')){
            loadSettingsUI();
        }
    }

    function switchTab(tabId, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById(tabId).classList.add('active');
    }

    function loadSettingsUI() {
        document.getElementById('profile-nickname').value = config.profile.nickname;
        document.getElementById('profile-avatar').value = config.profile.avatar;
        document.getElementById('profile-status').value = config.profile.headerSub;
        document.getElementById('textarea-words').value = config.wordCards.join('\n');
        document.getElementById('textarea-stickers').value = config.stickerCards.join('\n');
        document.getElementById('toggle-mixed-emoji').checked = config.isMixedMode;
    }

    function saveProfile() {
        config.profile.nickname = document.getElementById('profile-nickname').value || "Nova";
        config.profile.avatar = document.getElementById('profile-avatar').value.trim();
        config.profile.headerSub = document.getElementById('profile-status').value || "人的一生，会有太多个雨季";
        
        document.getElementById('header-sub-text').innerText = config.profile.headerSub;
        saveConfig();
        renderChat(); // 重新渲染首屏卡片
        alert('资料已保存！');
    }

    function saveCards() {
        const words = document.getElementById('textarea-words').value.split('\n').filter(w => w.trim() !== '');
        const stickers = document.getElementById('textarea-stickers').value.split('\n').filter(s => s.trim() !== '');
        
        config.wordCards = words.length > 0 ? words : defaultConfig.wordCards;
        config.stickerCards = stickers;
        
        saveConfig();
        alert('字卡库已更新！');
    }

    function saveConfig() {
        localStorage.setItem('spring_config', JSON.stringify(config));
    }

    function toggleAudio(isChecked) {
        if (isChecked) {
            bgAudio.play().catch(e => alert("浏览器拦截了自动播放，请在页面上随意点一下再开启"));
        } else {
            bgAudio.pause();
        }
    }

    function requestNotification(isChecked) {
        if (isChecked) {
            if (!("Notification" in window)) {
                alert("当前浏览器不支持通知");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("Spring 通知测试", { body: "通知功能已成功开启！" });
                } else {
                    document.getElementById('toggle-notification').checked = false;
                }
            });
        }
    }

    function sendNotification(title, body) {
        if (Notification.permission === "granted") {
            new Notification(title, { body: body });
        }
    }

    // 备份与恢复 (包含聊天和设置)
    function backupData() {
        const data = {
            chat: chatContainer.innerHTML,
            config: config
        };
        const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `spring_backup_${new Date().getTime()}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function restoreData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.chat) {
                    localStorage.setItem('spring_chat', data.chat);
                }
                if (data.config) {
                    config = data.config;
                    saveConfig();
                    loadSettingsUI();
                    document.getElementById('header-sub-text').innerText = config.profile.headerSub;
                }
                alert("数据恢复成功！即将刷新页面。");
                location.reload();
            } catch (err) {
                alert("文件损坏，无法恢复");
            }
        };
        reader.readAsText(file);
    }

    // 初始化
    window.onload = function() {
        document.getElementById('header-sub-text').innerText = config.profile.headerSub;
        
        // 渲染聊天记录
        renderChat();
        
        // 确保开启混合模式的状态
        document.getElementById('toggle-mixed-emoji').checked = config.isMixedMode;
        document.getElementById('toggle-mixed-emoji').addEventListener('change', (e) => {
            config.isMixedMode = e.target.checked;
            saveConfig();
        });
    };
</script>
</body>
</html>
